name: SixBytes SEO Maintenance

on:
  schedule:
    - cron: "30 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed SEO maintenance
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://sixbytes.in/api/cron/seo-maintenance")"
          cat "$response_file"
          test "$status" = "200"
          jq -e '.success == true' "$response_file" >/dev/null
